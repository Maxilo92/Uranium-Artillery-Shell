[mod-setting-description]
uranium-mutation-enabled=Wenn aktiviert, mutieren radioaktive Nester zu stärkeren Varianten und mutierte Einheiten können andere infizieren.
uranium-radiation-damage-percent=Anteil der maximalen Gesundheit, den die Strahlung pro Sekunde abzieht. Gilt für verstrahlte Einheiten und Spieler und für Nester und Würmer, solange sie im Fallout stehen. Rüstung schützt nicht davor.
uranium-player-damage-enabled=Wenn aktiviert, erleiden Spieler im Laufe der Zeit Strahlungsschaden.
uranium-artillery-blast-damage=Gesamtschaden der Explosion pro Ziel, je zur Hälfte physisch und Explosion. Die MK2-Granate verdreifacht ihn. 4000 reichen, um ein voll entwickeltes Nest mit einem Treffer zu zerstören.
uranium-artillery-radius=Explosionsradius der Granate. Das Fallout-Feld reicht etwa 1,7x weiter, die MK2-Granate verdreifacht beides. Hohe Werte kosten viel Leistung.
